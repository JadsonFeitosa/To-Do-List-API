[project]
name = "to-do-list-api"
version = "0.1.0"
description = ""
authors = [
    {name = "JadsonFeitosa", email = "jadson.feitosa.silva@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.29.0,<1.0.0)",
    "django-cors-headers (>=4.0.0,<5.0.0)"
]

[tool.poetry]
packages = [{include = "projeto_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "setup.settings"
pythonpath = "."
python_files = ["test_*.py", "*_tests.py", "tests.py"]
