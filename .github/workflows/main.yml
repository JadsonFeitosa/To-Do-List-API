name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Configura o MySQL para os testes exatamente como no seu docker-compose
      mysql:
        image: mysql:8.1
        env:
          MYSQL_DATABASE: teste
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 
        cache: 'pip' # Ativa o cache para instalações mais rápidas nos próximos deploys

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "ERRO: O arquivo requirements.txt não foi encontrado na raiz do projeto!"
          exit 1
        fi

    - name: Validar configurações do Django (Check)
      env:
        DJANGO_SECRET_KEY: 'ci-secret-key-for-testing'
        DJANGO_DEBUG: 'False'
        MYSQL_DATABASE: teste
        MYSQL_USER: root
        MYSQL_PASSWORD: root
        MYSQL_HOST: 127.0.0.1 # No GitHub Actions, o serviço roda em localhost
        MYSQL_PORT: '3306'
      run: |
        python manage.py check

    - name: Rodar Migrations
      env:
        DJANGO_SECRET_KEY: 'ci-secret-key-for-testing'
        DJANGO_DEBUG: 'False'
        MYSQL_DATABASE: teste
        MYSQL_USER: root
        MYSQL_PASSWORD: root
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: '3306'
      run: |
        python manage.py migrate

    - name: Rodar Testes
      env:
        DJANGO_SECRET_KEY: 'ci-secret-key-for-testing'
        DJANGO_DEBUG: 'False'
        MYSQL_DATABASE: teste
        MYSQL_USER: root
        MYSQL_PASSWORD: root
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: '3306'
      run: |
        python manage.py test